version: "3.9"

# ============================================================
#  Organic Food E-Commerce — Docker Compose Full Stack
#  Services:
#    - mongodb:  MongoDB Database (Persistent Volume)
#    - backend:  Express API (Node.js)
#    - frontend: Nginx Reverse Proxy + React Vite SPA
# ============================================================

services:

  # ── MongoDB Database ───────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: organic-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"           # Accessible on host at localhost:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Express API) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: organic-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Uses the dockerized mongodb service by default
      MONGO_URI: mongodb://mongodb:27017/ecommerce
      JWT_SECRET: devops_ecommerce_secret_key_2026_demo
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (Nginx serving Vite build) ────────────────────
  frontend:
    build:
      context: ./React/First
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""        # Relative URL proxied by Nginx
    container_name: organic-frontend
    restart: unless-stopped
    ports:
      - "80:80"                 # Accessible at http://localhost
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
