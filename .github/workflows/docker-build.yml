name: CI/CD — Build & Push to Docker Hub + GHCR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKERHUB_USER: partthh
  GHCR_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Build & Push Backend ─────────────────────────────────
  build-backend:
    name: Backend — Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            partthh/organic-food-backend:latest
            partthh/organic-food-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/organic-food-backend:latest
            ghcr.io/${{ github.repository_owner }}/organic-food-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & Push Frontend ────────────────────────────────
  build-frontend:
    name: Frontend — Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./React/First
          file: ./React/First/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            partthh/organic-food-frontend:latest
            partthh/organic-food-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/organic-food-frontend:latest
            ghcr.io/${{ github.repository_owner }}/organic-food-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Summary ──────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    steps:
      - name: Print image URLs
        run: |
          echo "✅ Docker Hub:"
          echo "   Backend:  https://hub.docker.com/r/partthh/organic-food-backend"
          echo "   Frontend: https://hub.docker.com/r/partthh/organic-food-frontend"
          echo ""
          echo "✅ GitHub Container Registry:"
          echo "   Backend:  ghcr.io/${{ github.repository_owner }}/organic-food-backend:latest"
          echo "   Frontend: ghcr.io/${{ github.repository_owner }}/organic-food-frontend:latest"
