# render.yaml — Infrastructure-as-Code for Render.com
# One-click deploy: https://render.com/deploy
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API ─────────────────────────────────────────────
  - type: web
    name: organic-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # You set this secret in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value

  # ── Frontend (Static Site) ──────────────────────────────────
  - type: web
    name: organic-frontend
    runtime: static
    staticPublishPath: ./dist
    buildCommand: npm ci && npm run build
    rootDir: React/First
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        fromService:
          name: organic-backend
          type: web
          property: host
          format: https://{host}
