# render.yaml — Backend API only (Frontend is on Vercel)
# One-click deploy: https://render.com/deploy?repo=https://github.com/ParthThakkarR/React-Project

services:
  - type: web
    name: organic-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
